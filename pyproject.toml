[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-dl"
version = "1.0.0"
description = "抖音无水印解析下载工具（浏览器代发请求，免签名逆向）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "playwright>=1.40",
    "rich>=13.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
douyin = "douyin_dl.cli:main"

[tool.setuptools]
packages = ["douyin_dl"]
